<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Kas Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Entri Voucher Kas Keluar</h2>
        
        <div id="journal-rows" class="space-y-4 mb-4">
            <!-- Baris Jurnal Default -->
            <div class="flex gap-4 items-end journal-row">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700">Nama Akun</label>
                    <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Kas / Beban">
                </div>
                <div class="w-48">
                    <label class="block text-sm font-medium text-gray-700">Debit</label>
                    <input type="number" min="0" class="debit-input mt-1 block w-full border border-gray-300 rounded-md p-2" value="0" oninput="calculateTotals()">
                </div>
                <div class="w-48">
                    <label class="block text-sm font-medium text-gray-700">Kredit</label>
                    <input type="number" min="0" class="kredit-input mt-1 block w-full border border-gray-300 rounded-md p-2" value="0" oninput="calculateTotals()">
                </div>
                <button type="button" class="bg-red-500 text-white px-3 py-2 rounded-md hover:bg-red-600" onclick="removeRow(this)">Hapus</button>
            </div>
        </div>

        <button type="button" class="text-blue-600 font-semibold mb-6 hover:underline" onclick="addRow()">+ Tambah Baris</button>

        <div class="border-t pt-4 flex justify-end gap-8 text-lg font-bold">
            <div>Total Debit: Rp <span id="total-debit">0</span></div>
            <div>Total Kredit: Rp <span id="total-kredit">0</span></div>
        </div>

        <div id="status-indicator" class="text-right mt-2 text-red-500 font-semibold">Unbalanced</div>

        <div class="mt-6 flex justify-end">
            <button id="submit-btn" disabled class="bg-gray-400 text-white px-6 py-2 rounded-md cursor-not-allowed transition-colors">
                Submit Voucher
            </button>
        </div>
    </div>

    <script>
        function addRow() {
            const container = document.getElementById('journal-rows');
            const row = document.createElement('div');
            row.className = 'flex gap-4 items-end journal-row';
            row.innerHTML = `
                <div class="flex-1">
                    <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Nama Akun">
                </div>
                <div class="w-48">
                    <input type="number" min="0" class="debit-input mt-1 block w-full border border-gray-300 rounded-md p-2" value="0" oninput="calculateTotals()">
                </div>
                <div class="w-48">
                    <input type="number" min="0" class="kredit-input mt-1 block w-full border border-gray-300 rounded-md p-2" value="0" oninput="calculateTotals()">
                </div>
                <button type="button" class="bg-red-500 text-white px-3 py-2 rounded-md hover:bg-red-600" onclick="removeRow(this)">Hapus</button>
            `;
            container.appendChild(row);
        }

        function removeRow(btn) {
            btn.parentElement.remove();
            calculateTotals();
        }

        function calculateTotals() {
            let totalDebit = 0;
            let totalKredit = 0;

            document.querySelectorAll('.debit-input').forEach(input => {
                totalDebit += Number(input.value) || 0;
            });
            document.querySelectorAll('.kredit-input').forEach(input => {
                totalKredit += Number(input.value) || 0;
            });

            document.getElementById('total-debit').innerText = totalDebit.toLocaleString('id-ID');
            document.getElementById('total-kredit').innerText = totalKredit.toLocaleString('id-ID');

            const submitBtn = document.getElementById('submit-btn');
            const statusInd = document.getElementById('status-indicator');

            // Asas zero-discrepancy logic
            if (totalDebit === totalKredit && totalDebit > 0) {
                submitBtn.disabled = false;
                submitBtn.className = "bg-green-600 text-white px-6 py-2 rounded-md hover:bg-green-700 cursor-pointer";
                statusInd.innerText = "Balanced - Siap Submit";
                statusInd.className = "text-right mt-2 text-green-600 font-semibold";
            } else {
                submitBtn.disabled = true;
                submitBtn.className = "bg-gray-400 text-white px-6 py-2 rounded-md cursor-not-allowed";
                statusInd.innerText = "Unbalanced";
                statusInd.className = "text-right mt-2 text-red-500 font-semibold";
            }
        }
    </script>
</body>
</html>
